set -Ugq @thm_func
set -Ugq @thm_type
set -Ugq @thm_variable
set -Ugq @thm_constant
set -Ugq @thm_operator
set -Ugq @thm_annotation
set -Ugq @thm_param
set -Ugq @thm_member
set -Ugq @thm_tag
set -Ugq @thm_attr
set -Ugq @thm_module
set -Ugq @thm_macro
set -Ugq @thm_err
set -Ugq @thm_warn
set -Ugq @thm_info
