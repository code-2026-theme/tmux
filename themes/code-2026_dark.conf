# vim:set ft=tmux:

# --> Code 2026 Dark
# VS Code Dark Modern 2026 palette

# Reset all @thm_* variables when switching flavors
%if "#{==:#{@code-2026_reset},true}"
set -Ugq @thm_bg
set -Ugq @thm_bg_alt
set -Ugq @thm_bg_menu
set -Ugq @thm_bg_line
set -Ugq @thm_bg_widget
