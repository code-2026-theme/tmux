# Backgrounds
set -ogq @thm_bg "#121314"
set -ogq @thm_bg_alt "#191a1b"
set -ogq @thm_bg_menu "#202122"
set -ogq @thm_bg_line "#242526"
set -ogq @thm_bg_widget "#262728"
set -ogq @thm_border "#2a2b2c"
set -ogq @thm_border_alt "#333536"

# Foregrounds
set -ogq @thm_fg "#bbbebf"
set -ogq @thm_fg_alt "#bfbfbf"
set -ogq @thm_fg_dim "#8c8c8c"
set -ogq @thm_fg_muted "#555555"
set -ogq @thm_white "#ffffff"

# Accent
set -ogq @thm_accent "#3994bc"
set -ogq @thm_accent_dim "#297aa0"
set -ogq @thm_accent_alt "#48a0c7"

# Syntax
set -ogq @thm_comment "#8b949e"
set -ogq @thm_string "#a5d6ff"
