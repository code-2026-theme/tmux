# vim:set ft=tmux:

# Code 2026 - Main Configuration
# Loads the selected flavor and applies all styles.

# ─── Flavor selection ────────────────────────────────────────────────────────

%if "#{==:#{@code-2026-flavor},sync}"
  # Sync mode: re-apply theme on OS dark/light mode changes (tmux 3.2+)
  set-hook -g client-dark-theme {
    set -g @code-2026-flavor "dark"
    set -g @code-2026_reset "true"
    run "tmux source-file #{d:current_file}/code-2026_main.conf"
  }
  set-hook -g client-light-theme {
    set -g @code-2026-flavor "light"
    set -g @code-2026_reset "true"
    run "tmux source-file #{d:current_file}/code-2026_main.conf"
  }
  # Load initial flavor based on current OS mode
  %if "#{==:#{shell_output,defaults read -g AppleInterfaceStyle 2>/dev/null},Dark}"
    source -F "#{d:current_file}/themes/code-2026_dark.conf"
  %else
    source -F "#{d:current_file}/themes/code-2026_light.conf"
  %endif
%elif "#{==:#{@code-2026-flavor},auto}"
  # Auto mode: detect macOS dark mode once at startup
  %if "#{==:#{shell_output,defaults read -g AppleInterfaceStyle 2>/dev/null},Dark}"
    source -F "#{d:current_file}/themes/code-2026_dark.conf"
  %else
    source -F "#{d:current_file}/themes/code-2026_light.conf"
  %endif
%elif "#{==:#{@code-2026-flavor},light}"
  source -F "#{d:current_file}/themes/code-2026_light.conf"
%else
  source -F "#{d:current_file}/themes/code-2026_dark.conf"
%endif

# ─── Status style ────────────────────────────────────────────────────────────

set -gF status-style "bg=#{@thm_bg_alt},fg=#{@thm_fg}"
set -g status-justify "left"
set -gF status-interval "#{@code-2026-status-interval}"
set -gF status-left-length "#{@code-2026-status-left-length}"
set -gF status-right-length "#{@code-2026-status-right-length}"

# ─── Status left ─────────────────────────────────────────────────────────────

set -gqF @_code2026_left ""

# session module
%if "#{m:*session*,#{@code-2026-status-left}}"
  set -agqF @_code2026_left "#[fg=#{@thm_bg},bg=#{@thm_accent}] #S "
  set -agqF @_code2026_left "#[fg=#{@thm_accent},bg=#{@thm_bg_alt}]"
%endif

# directory module
%if "#{m:*directory*,#{@code-2026-status-left}}"
  set -agqF @_code2026_left " #[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}]#{?#{==:#{@code-2026-status-left-separator},}, }#{@code-2026-status-left-separator}"
  set -agqF @_code2026_left "#[fg=#{@thm_comment},bg=#{@thm_bg_alt}] #W "
%endif

set -gF status-left "#{E:@_code2026_left}"
set -ug @_code2026_left

# ─── Status right ────────────────────────────────────────────────────────────

set -gqF @_code2026_right ""

# date_time module (always last)
%if "#{m:*date_time*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}] %Y-%m-%d %H:%M "
%endif

# ram module
%if "#{m:*ram*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}]#{?#{==:#{@code-2026-status-right-separator},}, }#{@code-2026-status-right-separator}"
  set -agqF @_code2026_right "#[fg=#{@thm_func},bg=#{@thm_bg_alt}] #{ram_icon}#{ram_percentage} "
%endif

# cpu module
%if "#{m:*cpu*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}]#{?#{==:#{@code-2026-status-right-separator},}, }#{@code-2026-status-right-separator}"
  set -agqF @_code2026_right "#[fg=#{@thm_type},bg=#{@thm_bg_alt}] #{cpu_icon}#{cpu_percentage} "
%endif

# application module
%if "#{m:*application*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}]#{?#{==:#{@code-2026-status-right-separator},}, }#{@code-2026-status-right-separator}"
  set -agqF @_code2026_right "#[fg=#{@thm_annotation},bg=#{@thm_bg_alt}] #{pane_current_command} "
%endif

set -gF status-right "#{E:@_code2026_right}"
set -ug @_code2026_right

# ─── Messages ────────────────────────────────────────────────────────────────

set -gF message-style "#{E:@code-2026-message-style}"
set -gF message-command-style "#{E:@code-2026-message-command-style}"

# ─── Mode ────────────────────────────────────────────────────────────────────

set -gwF mode-style "#{E:@code-2026-mode-style}"

# ─── Panes ───────────────────────────────────────────────────────────────────

set -gwF pane-active-border-style "#{E:@code-2026-pane-active-border-style}"
set -gwF pane-border-style "#{E:@code-2026-pane-border-style}"
set -gwF pane-border-status "#{E:@code-2026-pane-border-status}"

# ─── Windows ─────────────────────────────────────────────────────────────────

set -gwF window-status-separator ""
set -gwF window-status-format \
  "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}] #I:#W "
set -gwF window-status-current-format \
  "#[fg=#{@thm_bg},bg=#{@thm_accent}] #I:#W "
set -gwF window-status-activity-style \
  "fg=#{@thm_warn},bg=#{@thm_bg_alt},bold"
set -gwF window-status-bell-style \
  "fg=#{@thm_err},bg=#{@thm_bg_alt},bold"

# ─── Clock ───────────────────────────────────────────────────────────────────

set -gwF clock-mode-colour "#{E:@code-2026-clock-mode-colour}"
set -gwF clock-mode-style "#{E:@code-2026-clock-mode-style}"

# ─── Popups (tmux 3.4+) ────────────────────────────────────────────────────

%if "#{>=:#{version},3.4}"
  set -gF popup-style "#{E:@code-2026-popup-style}"
  set -gF popup-border-style "#{E:@code-2026-popup-border-style}"
%endif

# ─── Display panes ───────────────────────────────────────────────────────────

set -gF display-panes-active-colour "#{@thm_accent}"
set -gF display-panes-colour "#{@thm_surface_0}"

# ─── Terminal colors ─────────────────────────────────────────────────────────

set -gF terminal-overrides ",xterm-256color:colors=256,Tc"
set -g default-terminal "tmux-256color"

set -gF -s terminal-colors[0] "#{@thm_ansi_black}"
set -gF -s terminal-colors[1] "#{@thm_ansi_red}"
set -gF -s terminal-colors[2] "#{@thm_ansi_green}"
set -gF -s terminal-colors[3] "#{@thm_ansi_yellow}"
set -gF -s terminal-colors[4] "#{@thm_ansi_blue}"
set -gF -s terminal-colors[5] "#{@thm_ansi_magenta}"
set -gF -s terminal-colors[6] "#{@thm_ansi_cyan}"
set -gF -s terminal-colors[7] "#{@thm_ansi_white}"
set -gF -s terminal-colors[8] "#{@thm_ansi_bright_black}"
set -gF -s terminal-colors[9] "#{@thm_ansi_bright_red}"
set -gF -s terminal-colors[10] "#{@thm_ansi_bright_green}"
set -gF -s terminal-colors[11] "#{@thm_ansi_bright_yellow}"
set -gF -s terminal-colors[12] "#{@thm_ansi_bright_blue}"
set -gF -s terminal-colors[13] "#{@thm_ansi_bright_magenta}"
set -gF -s terminal-colors[14] "#{@thm_ansi_bright_cyan}"
set -gF -s terminal-colors[15] "#{@thm_ansi_bright_white}"
