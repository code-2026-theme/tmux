# vim:set ft=tmux:

# Code 2026 - Main Configuration
# Loads the selected flavor and applies all styles.

# ─── Flavor selection ────────────────────────────────────────────────────────

%if "#{==:#{@code-2026-flavor},sync}"
  set-hook -g client-dark-theme {
    set -g @code-2026-flavor "dark"
    set -g @code-2026_reset "true"
    run "tmux source-file $(tmux show -gqv @code-2026-dir)/code-2026_main.conf"
  }
  set-hook -g client-light-theme {
    set -g @code-2026-flavor "light"
    set -g @code-2026_reset "true"
    run "tmux source-file $(tmux show -gqv @code-2026-dir)/code-2026_main.conf"
  }
  run "tmux source-file $(tmux show -gqv @code-2026-dir)/themes/code-2026_$([ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark" ] && echo dark || echo light).conf"
%elif "#{==:#{@code-2026-flavor},auto}"
  run "tmux source-file $(tmux show -gqv @code-2026-dir)/themes/code-2026_$([ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark" ] && echo dark || echo light).conf"
%elif "#{==:#{@code-2026-flavor},light}"
  run "tmux source-file $(tmux show -gqv @code-2026-dir)/themes/code-2026_light.conf"
%else
  run "tmux source-file $(tmux show -gqv @code-2026-dir)/themes/code-2026_dark.conf"
%endif

# ─── Status style ────────────────────────────────────────────────────────────

set -gF status-style "bg=#{@thm_bg_alt},fg=#{@thm_fg}"
set -g status-justify "left"
set -gF status-interval "#{@code-2026-status-interval}"
set -gF status-left-length "#{@code-2026-status-left-length}"
set -gF status-right-length "#{@code-2026-status-right-length}"

# ─── Status left ─────────────────────────────────────────────────────────────

set -gqF @_code2026_left ""

%if "#{m:*session*,#{@code-2026-status-left}}"
  set -agqF @_code2026_left "#[fg=#{@thm_bg},bg=#{@thm_accent},#{@code-2026-session-style}] #S "
  set -agqF @_code2026_left "#[fg=#{@thm_accent},bg=#{@thm_bg_alt}]"
%endif

%if "#{m:*directory*,#{@code-2026-status-left}}"
  set -agqF @_code2026_left " #[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}] "
  set -agqF @_code2026_left "#[fg=#{@thm_comment},bg=#{@thm_bg_alt},#{@code-2026-directory-style}] #W "
%endif

set -gF status-left "#{E:@_code2026_left}"
set -ug @_code2026_left

# ─── Status right ────────────────────────────────────────────────────────────

set -gqF @_code2026_right ""

%if "#{m:*date_time*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt},#{@code-2026-date_time-style}] %Y-%m-%d %H:%M "
%endif

%if "#{m:*ram*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}] "
  set -agqF @_code2026_right "#[fg=#{@thm_func},bg=#{@thm_bg_alt},#{@code-2026-ram-style}] #{ram_icon}#{ram_percentage} "
%endif

%if "#{m:*cpu*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}] "
  set -agqF @_code2026_right "#[fg=#{@thm_type},bg=#{@thm_bg_alt},#{@code-2026-cpu-style}] #{cpu_icon}#{cpu_percentage} "
%endif

%if "#{m:*application*,#{@code-2026-status-right}}"
  set -agqF @_code2026_right "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt}] "
  set -agqF @_code2026_right "#[fg=#{@thm_annotation},bg=#{@thm_bg_alt},#{@code-2026-application-style}] #{pane_current_command} "
%endif

set -gF status-right "#{E:@_code2026_right}"
set -ug @_code2026_right

# ─── Messages ────────────────────────────────────────────────────────────────

set -gF message-style "fg=#{@thm_fg},bg=#{@thm_bg_menu}"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_bg_menu}"

# ─── Mode ────────────────────────────────────────────────────────────────────

set -gwF mode-style "fg=#{@thm_bg},bg=#{@thm_accent},bold"

# ─── Panes ───────────────────────────────────────────────────────────────────

set -gwF pane-active-border-style "fg=#{@thm_accent}"
set -gwF pane-border-style "fg=#{@thm_border}"
set -gwF pane-border-status "#{@code-2026-pane-border-status}"

# ─── Windows ─────────────────────────────────────────────────────────────────

set -gwF window-status-separator ""
set -gwF window-status-format \
  "#[fg=#{@thm_fg_dim},bg=#{@thm_bg_alt},#{@code-2026-window-style}] #{@code-2026-window-format} "
set -gwF window-status-current-format \
  "#[fg=#{@thm_bg},bg=#{@thm_accent},#{@code-2026-window-current-style}] #{@code-2026-window-current-format} "
set -gwF window-status-activity-style \
  "fg=#{@thm_warn},bg=#{@thm_bg_alt},bold"
set -gwF window-status-bell-style \
  "fg=#{@thm_err},bg=#{@thm_bg_alt},bold"

# ─── Clock ───────────────────────────────────────────────────────────────────

set -gwF clock-mode-colour "#{@thm_accent}"
set -gwF clock-mode-style "#{@code-2026-clock-mode-style}"

# ─── Popups (tmux 3.4+) ────────────────────────────────────────────────────

%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_border_alt}"
%endif

# ─── Display panes ───────────────────────────────────────────────────────────

set -gF display-panes-active-colour "#{@thm_accent}"
set -gF display-panes-colour "#{@thm_border}"
