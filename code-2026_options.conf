# vim:set ft=tmux:

# Code 2026 - Default Options
# Set these before sourcing the theme to customize.

# Plugin directory (set by options.conf, used by main.conf)
run-shell "tmux set -g @code-2026-dir '#{d:current_file}'"

# Flavor: dark | light | auto | sync
# auto = detect macOS dark/light mode once at startup
# sync = listen for OS dark/light mode changes and re-apply (tmux 3.2+)
set -ogq @code-2026-flavor "dark"

# Status modules (comma-separated list of enabled modules)
set -ogq @code-2026-status-left "session,directory"
set -ogq @code-2026-status-right "application,cpu,ram,date_time"

# Status separators
set -ogq @code-2026-status-left-separator " "
set -ogq @code-2026-status-right-separator " "

# Status line length
set -ogq @code-2026-status-left-length "40"
set -ogq @code-2026-status-right-length "40"
set -ogq @code-2026-status-interval "5"

# Clock
set -ogq @code-2026-clock-mode-style "24"

# Window format
set -ogq @code-2026-window-format "#I:#W"
set -ogq @code-2026-window-current-format "#I:#W"
set -ogq @code-2026-window-style ""
set -ogq @code-2026-window-current-style "bold"

# Pane border status
set -ogq @code-2026-pane-border-status "off"
